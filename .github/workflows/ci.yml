name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile app.py

      - name: Flask smoke test
        env:
          WEB_DECK_TOKEN: test-token
        run: |
          python - <<'PY'
          import app

          client = app.app.test_client()
          paths = [
              "/?token=test-token&page=All",
              "/settings?token=test-token&page=All",
              "/qr?token=test-token",
              "/qr.png?token=test-token",
              "/api/theme?token=test-token",
          ]
          for path in paths:
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
          PY
